    <!-- CMM prototype (GitHub Pages): resolve deep links and default the site
     root to the Conversational Money Map screen before the app boots. Injected
     at the top of the exported index.html <head> by scripts/cmm-pages/deploy.sh. -->
<script>
  (function () {
    var base = '/conversational-money-map-prototype';
    var target = base + '/prototypes/conversational-money-map';
    var l = window.location;
    // 1) SPA deep-link restore (spa-github-pages): 404.html encodes the
    //    requested path into "?/...". Rebuild the real path here.
    if (l.search && l.search.charAt(1) === '/') {
      var decoded = l.search
        .slice(1)
        .split('&')
        .map(function (s) {
          return s.replace(/~and~/g, '&');
        })
        .join('?');
      window.history.replaceState(
        null,
        null,
        l.pathname.slice(0, -1) + decoded + l.hash,
      );
    }
    // 2) Default the bare site root to the CMM prototype route so the
    //    landing URL opens the prototype (not the sign-in screen).
    var p = window.location.pathname.replace(/\/*$/, '');
    if (p === base || p === '') {
      window.history.replaceState(
        null,
        null,
        target + window.location.search + window.location.hash,
      );
    }
  })();
</script>
